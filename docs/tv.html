<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>쿠키 살인 사건 TV</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nanum+Gothic+Coding:wght@400;700&family=Gowun+Batang:wght@400;700&family=VT323&display=swap">
<style>
/* Layout: a 1970s wooden-cabinet CRT set fills the phone. Picture tube on top (what the viewer may see),
   control panel (channel knob + dial, grille) beside/below it, and a "remote" tray under the set for inputs. Single dark look by design. */
:root{
  --room:#0b0908;
  --wood:#5b3a21; --wood2:#2e1a0e; --wood-hi:#8a5a33;
  --bezel:#1a1714; --bezel-hi:#3a332c;
  --glass:#0c140f;
  --phos:#d8f0c8; --phos-dim:#6f8a68;
  --amber:#e7b55a;
  --red:#c2463c; --ochre:#c69a5b; --violet:#a98be0;
  --tray:#15110e; --tray-edge:#2a221b;
  --fg:#e9e2d4; --dim:#9a9083;
  --mono:"Nanum Gothic Coding","Apple SD Gothic Neo","Malgun Gothic",monospace;
  --serif:"Gowun Batang","Apple SD Gothic Neo",serif;
  --digit:"VT323","Nanum Gothic Coding",monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--room);color:var(--fg);font-family:var(--mono);font-size:15px;line-height:1.5;
  background-image:radial-gradient(ellipse at 50% 20%,#1a1410 0%,var(--room) 60%);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 20px}
.room{max-width:760px;margin-inline:auto;display:flex;flex-direction:column;gap:14px}
button{font:inherit;color:inherit;background:#221c17;border:1px solid #3a3027;border-radius:8px;padding:9px 11px;cursor:pointer;min-width:0;text-align:left;line-height:1.3}
button:hover{background:#2a231d}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
button:disabled{opacity:.38;cursor:not-allowed}
button.primary{background:#3b2b12;border-color:#7a5a24;color:#f2d79a}
button.danger{background:#3a1613;border-color:#6d2a25;color:#f1b2aa}
button.ghost{background:transparent}
button small{display:block;color:var(--dim);font-size:11px;margin-top:2px}
input,select,textarea{font:inherit;color:var(--fg);background:#0f0c0a;border:1px solid #3a3027;border-radius:8px;padding:9px 11px;width:100%}
label{display:block;font-size:12px;color:var(--dim);margin-bottom:4px;letter-spacing:.04em}
h1,h2,h3{margin:0;text-wrap:balance;font-weight:700}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row>*{flex:1 1 120px;min-width:0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
.hint{font-size:12px;color:var(--dim)}
.tiny{font-size:11px;color:var(--dim)}
.pill{display:inline-block;padding:1px 8px;border-radius:999px;background:#2a221b;font-size:12px;color:var(--dim);vertical-align:middle}
.tag{display:inline-block;font-size:11px;padding:1px 7px;border-radius:999px;border:1px solid currentColor;vertical-align:middle}
.tag.C{color:#ef8f86}.tag.D{color:#dcb47c}

/* ===== THE SET ===== one fixed-proportion object. Every chassis size is in cqw (container width),
   so the set keeps the same shape at every viewport: screen 4:3, panel 22% of the width on the right. */
.tv{position:relative;container-type:inline-size;filter:drop-shadow(0 18px 30px rgba(0,0,0,.7))}
.antenna{position:relative;height:5cqw;margin:0 auto;width:40cqw}
.antenna i{position:absolute;bottom:0;left:50%;width:.5cqw;height:6cqw;background:linear-gradient(#cfcfcf,#6a6a6a);border-radius:2px;transform-origin:bottom}
.antenna i:first-child{transform:translateX(-50%) rotate(-28deg)}
.antenna i:last-child{transform:translateX(-50%) rotate(26deg)}
.antenna i::after{content:"";position:absolute;top:-.6cqw;left:-.4cqw;width:1.2cqw;height:1.2cqw;border-radius:50%;background:#ddd}
.cabinet{background:
   repeating-linear-gradient(92deg,rgba(255,255,255,.04) 0 2px,transparent 2px 9px,rgba(0,0,0,.08) 9px 11px,transparent 11px 23px),
   linear-gradient(180deg,var(--wood-hi) 0,var(--wood) 12%,#4a2e1a 60%,var(--wood2) 100%);
  border-radius:3cqw;padding:2.2cqw;display:grid;grid-template-columns:1fr 20cqw;gap:2cqw;
  box-shadow:inset 0 2px 0 rgba(255,255,255,.18),inset 0 -6px 12px rgba(0,0,0,.5),0 0 0 2px #1a0f08}
.bezel{background:linear-gradient(160deg,var(--bezel-hi),var(--bezel) 40%,#0d0b09);border-radius:2.2cqw;padding:1.8cqw;box-shadow:inset 0 0 0 1px #000,inset 0 4px 14px rgba(0,0,0,.8);min-width:0}
.screen{position:relative;aspect-ratio:4/3;max-width:100%;border-radius:5cqw/4cqw;background:var(--glass);overflow:hidden;
  box-shadow:inset 0 0 40px #000,inset 0 0 6px rgba(120,160,120,.25)}
.screen.on{background:radial-gradient(ellipse at 50% 45%,#122218 0%,#0b140f 70%,#070b09 100%)}
.screen::before{content:"";position:absolute;inset:0;pointer-events:none;z-index:5;border-radius:inherit;
  background:repeating-linear-gradient(0deg,rgba(0,0,0,.22) 0 1px,transparent 1px 3px)}
.screen::after{content:"";position:absolute;inset:0;pointer-events:none;z-index:6;border-radius:inherit;
  background:radial-gradient(ellipse at 30% 10%,rgba(255,255,255,.14) 0,rgba(255,255,255,.04) 25%,transparent 50%),
             radial-gradient(ellipse at 50% 50%,transparent 60%,rgba(0,0,0,.55) 100%)}
.static{position:absolute;inset:0;z-index:4;pointer-events:none;opacity:0;background-image:
   repeating-radial-gradient(circle at 17% 33%,#fff 0 1px,transparent 1px 2px),
   repeating-radial-gradient(circle at 70% 60%,#aaa 0 1px,transparent 1px 3px),
   repeating-linear-gradient(0deg,rgba(255,255,255,.35) 0 1px,rgba(0,0,0,.6) 1px 2px);
  background-size:3px 3px,5px 5px,100% 4px;mix-blend-mode:screen}
.screen.nosignal .static{opacity:.2;animation:snow .12s steps(2) infinite}
.screen.zap .static{animation:zap .35s steps(3) 1}
@keyframes snow{from{background-position:0 0,0 0,0 0}to{background-position:3px 2px,-4px 3px,0 2px}}
@keyframes zap{0%{opacity:.9}60%{opacity:.4}100%{opacity:0}}
@media (prefers-reduced-motion:reduce){.screen.nosignal .static,.screen.zap .static{animation:none}}
/* screen type scales with the set but stays readable: ~13px on a 390px phone, 15px from 560px up */
.face{position:absolute;inset:0;z-index:3;display:flex;flex-direction:column;padding:2.2cqw 3cqw;gap:.8cqw;color:var(--phos);font-family:var(--mono);min-width:0;font-size:clamp(11px,3.3cqw,15px);line-height:1.45}
.osd{display:flex;justify-content:space-between;align-items:baseline;gap:1.5cqw;font-family:var(--digit);font-size:clamp(15px,4.2cqw,22px);line-height:1.2;min-height:1.2em;color:var(--amber);letter-spacing:.05em;text-shadow:0 0 6px rgba(231,181,90,.6);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden}
.osd>span:first-child{flex:0 0 auto}
.osd>span:last-child{overflow:hidden;text-overflow:clip;min-width:0;text-align:right}
.osd .rec{color:var(--red)}
.osd .rec::before{content:"\25cf  ";animation:blink 1.2s steps(1) infinite}
@keyframes blink{50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){.osd .rec::before{animation:none}}
.ticker{position:absolute;left:3cqw;right:3cqw;bottom:3cqw;z-index:4;pointer-events:none;font-size:.95em;box-shadow:0 4px 14px rgba(0,0,0,.5);color:#f6dc9c;background:rgba(231,181,90,.14);border:1px solid rgba(231,181,90,.6);border-radius:6px;padding:.5em .8em;line-height:1.4;text-shadow:none}
.ticker.bad{color:#ffb3aa;background:rgba(194,70,60,.16);border-color:rgba(239,154,144,.7)}
.ticker.good{color:#c8f5c0;background:rgba(184,240,176,.12);border-color:rgba(184,240,176,.6)}
/* 알림은 불투명 — 아래 글자와 겹쳐 읽히지 않게 */
.ticker{background:#2b2413}.ticker.bad{background:#2e1512}.ticker.good{background:#16261a}
.body{flex:1 1 auto;min-height:0;overflow:auto;scrollbar-width:thin;display:flex;flex-direction:column;gap:.8cqw;text-shadow:0 0 4px rgba(216,240,200,.45)}
.body p{margin:0}
.title{font-family:var(--serif);font-size:1.15em;color:#f3ecd8}
.chname{font-size:.85em;color:var(--phos-dim);letter-spacing:.14em;text-transform:uppercase}
.nosig{display:flex;align-items:center;justify-content:center;height:100%;font-family:var(--digit);font-size:clamp(22px,7cqw,36px);color:#cfd8c8;letter-spacing:.2em;text-shadow:0 0 10px #fff;text-align:center;line-height:1.1}
.logl{display:flex;flex-direction:column;gap:.4cqw;font-size:.9em}
.logl .e{display:flex;gap:1.2cqw;align-items:baseline}
.logl .e time{font-family:var(--digit);font-size:1.25em;color:var(--phos-dim);flex:0 0 3.4em;font-variant-numeric:tabular-nums}
.logl .e.C span::before{content:"\bc94\c778 ";color:#ef8f86}
.logl .e.D span::before{content:"\d615\c0ac ";color:#dcb47c}
.logl .e.sys{color:var(--amber)}
.logl .e.bad{color:#ef9a90}.logl .e.good{color:#b8f0b0}.logl .e.q{color:var(--violet)}
.flash{animation:fl .5s steps(2) 1}
@keyframes fl{from{opacity:.25}to{opacity:1}}
.photo{position:relative;width:100%;aspect-ratio:4/3;max-width:100%;border-radius:6px;overflow:hidden;cursor:crosshair;background:#1e2a22;flex:0 0 auto}
.photo.fill{aspect-ratio:auto;flex:1 1 auto;min-height:0;background:#0a110d}
.photo img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;display:block;filter:saturate(.8) contrast(1.05)}
.photo .layer{position:absolute;left:0;top:0;width:100%;height:100%;touch-action:none}
.photo .glow{position:absolute;transform:translate(-50%,-50%);border-radius:50%;pointer-events:none;z-index:2;
  background:radial-gradient(circle,rgba(255,236,180,.55),rgba(255,236,180,.22) 45%,transparent 70%);box-shadow:0 0 14px 4px rgba(255,236,180,.35);mix-blend-mode:screen;animation:glowfade 1.5s ease-out forwards}
@keyframes glowfade{0%{opacity:0}20%{opacity:1}100%{opacity:0}}
.photo .spot.found i{cursor:pointer}
.photo .spot.found b{cursor:pointer}
.photo .plabel{position:absolute;left:0;right:0;top:0;display:flex;justify-content:space-between;gap:8px;padding:.3em .6em;font-size:.8em;color:var(--phos);background:linear-gradient(rgba(0,0,0,.7),transparent);pointer-events:none;z-index:2;text-shadow:0 1px 2px #000}
.photo .pbig{position:absolute;right:.4em;bottom:.4em;z-index:4;width:2em;height:2em;padding:0;border-radius:6px;background:rgba(0,0,0,.6);border:1px solid rgba(216,240,200,.5);color:var(--phos);font-size:1em;line-height:1;text-align:center;cursor:pointer}
.bigview{display:flex;flex-direction:column;gap:8px}
.bigview .photo{aspect-ratio:4/3;width:100%;max-height:72vh;flex:0 0 auto;cursor:crosshair;background:#0a110d}
.photo .cap{position:absolute;left:4%;right:4%;bottom:4%;background:rgba(6,12,8,.86);border:1px solid var(--amber);border-radius:6px;padding:.5em .8em;color:#f6e9c8;font-size:.95em;line-height:1.45;text-shadow:none;z-index:3}
.photo .cap b{color:var(--amber);margin-right:.4em}
.photo .cap .picbtn{display:block;margin:.45em 0 0;padding:.3em .6em;font:inherit;background:transparent;color:#ffe6a8;border:1px solid rgba(231,181,90,.55);border-radius:4px;cursor:pointer}
.picview img{display:block;width:100%;height:auto;max-height:72vh;object-fit:contain;border-radius:6px;margin:.5em 0}
.photo .cap .take{display:block;margin:.45em 0 0;padding-top:.4em;border-top:1px solid rgba(231,181,90,.35);color:#ffe6a8;letter-spacing:.02em}
.photo .cap.flash{animation:fl .5s steps(2) 1}
.photo .ph{position:absolute;inset:0;z-index:0;background:
   linear-gradient(rgba(216,240,200,.10) 1px,transparent 1px),linear-gradient(90deg,rgba(216,240,200,.10) 1px,transparent 1px),
   radial-gradient(ellipse at 50% 50%,#2a3a2e,#141c17);background-size:25% 25%,25% 25%,100% 100%;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:4px;color:var(--phos-dim);font-family:var(--digit);font-size:2em;letter-spacing:.1em}
.photo .ph small{font-family:var(--mono);font-size:.8rem;letter-spacing:0}
.photo .spot{position:absolute;width:0;height:0}
.photo .spot i{position:absolute;left:0;top:0;transform:translate(-50%,-50%);width:var(--d);height:var(--d);border-radius:50%;border:1px dashed rgba(231,181,90,.9);background:rgba(231,181,90,.12)}
.photo .spot.found i{border:2px solid var(--phos);background:rgba(216,240,200,.18)}
.photo .spot.miss i{border:1px solid rgba(239,154,144,.8);width:10px;height:10px;background:transparent}
.photo .spot b{position:absolute;left:8px;top:-8px;font-size:.75em;color:var(--amber);white-space:nowrap;background:rgba(0,0,0,.6);padding:0 4px;border-radius:3px;font-weight:400}
.found-line{font-size:.95em;color:#f3ecd8;border-left:2px solid var(--amber);padding-left:8px}
.memq{font-family:var(--serif);font-size:1.2em;line-height:1.7;color:#f3ecd8}
.memq.reveal{color:#e9d7f5}
.interlog{display:flex;flex-direction:column;gap:6px;font-size:.9em}
.interlog .q{border-left:2px solid var(--ochre);padding-left:8px}
.interlog .q.C{border-color:var(--red)}
.interlog .q .a{color:var(--amber)}
.optlist{display:flex;flex-direction:column;gap:6px}
.optlist button{font-size:.9em;background:#1a2620;border-color:#2f4337;color:var(--phos);position:relative}
.optlist button.sel{background:#3b2b12;border:2px solid var(--amber);color:#f6dc9c;box-shadow:0 0 0 3px rgba(231,181,90,.25),0 0 14px rgba(231,181,90,.35);padding-left:2.2em}
.optlist button.sel::before{content:"\25CF";position:absolute;left:.7em;top:.55em;font-weight:700;color:var(--amber)}
.optlist button.sel small{color:#d9c9a8}
.sheet .optlist button{font-size:14px;padding:12px 12px}
.notes{display:flex;flex-direction:column;gap:6px;font-size:.95em}
.notes .n{border-left:2px solid var(--ochre);padding-left:8px}
.notes .n.C{border-color:var(--red)}
.endscreen{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;gap:8px;text-align:center}
.endscreen .big{font-family:var(--digit);font-size:clamp(26px,8cqw,40px);color:var(--amber);letter-spacing:.2em;text-shadow:0 0 10px rgba(231,181,90,.7)}

/* control panel: a fixed column on the right at every width */
.panel{display:flex;flex-direction:column;align-items:center;gap:1.4cqw;padding:.6cqw 0;color:#d9c9a8;min-width:0}
.knobwrap{display:flex;flex-direction:column;align-items:center;gap:.4cqw}
.knob{width:9cqw;height:9cqw;border-radius:50%;background:radial-gradient(circle at 35% 30%,#4a4139,#1b1714 70%);box-shadow:inset 0 1px 0 rgba(255,255,255,.2),0 3px 6px rgba(0,0,0,.7);position:relative;cursor:pointer;border:0;padding:0;flex:0 0 auto}
.knob::after{content:"";position:absolute;left:50%;top:8%;width:.6cqw;height:30%;margin-left:-.3cqw;background:var(--amber);border-radius:2px;transform-origin:50% 140%;transform:rotate(var(--rot,0deg));transition:transform .25s}
.klabel{font-family:var(--digit);font-size:clamp(10px,2.2cqw,15px);letter-spacing:.14em;color:#cbb88f}
.dial{display:grid;grid-template-columns:1fr;gap:0;font-family:var(--digit);font-size:clamp(10px,2.3cqw,15px);color:#9c8c6c;width:100%;line-height:1.35}
.dial button{background:none;border:0;padding:0 .4cqw;font:inherit;color:inherit;text-align:left;border-radius:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;width:100%}
.dial button.on{color:var(--amber);text-shadow:0 0 4px rgba(231,181,90,.6)}
.led{width:1.4cqw;height:1.4cqw;border-radius:50%;background:#3a1a16;box-shadow:inset 0 0 2px #000}
.led.on{background:#ff5a4c;box-shadow:0 0 8px #ff5a4c}
.grille{width:100%;flex:1 1 3cqw;min-height:3cqw;background:repeating-linear-gradient(180deg,#1d150f 0 3px,#3b2816 3px 6px);border-radius:.8cqw;box-shadow:inset 0 0 6px rgba(0,0,0,.7)}
.brand{font-family:var(--digit);font-size:clamp(8px,1.7cqw,13px);letter-spacing:.14em;color:#d2b88b;text-shadow:0 1px 0 #000;white-space:nowrap;overflow:hidden;max-width:100%;text-overflow:clip}
.feet{display:flex;justify-content:space-between;padding:0 6cqw}
.feet i{width:4cqw;height:2.2cqw;background:linear-gradient(#3a2414,#1b0f08);border-radius:0 0 .8cqw .8cqw}
.pbtn{font-family:var(--digit);font-size:clamp(10px,2.3cqw,16px);letter-spacing:.12em;padding:.8cqw .6cqw;border-radius:1cqw;background:linear-gradient(#3a2f26,#1b1512);border:1px solid #574538;color:#e6d2a8;box-shadow:0 2px 0 #000;text-align:center;width:100%;line-height:1.2}
.pbtn:hover{background:linear-gradient(#45392e,#211a16)}
.pbtn.end{color:#ff8a7a;border-color:#7a3a33;background:linear-gradient(#4a1f1a,#2a110e)}
.pbtn.end:disabled{opacity:.35}
.pbtn.end.go{box-shadow:0 0 10px rgba(255,90,76,.6),0 2px 0 #000}
.prow{display:flex;gap:.6cqw;width:100%}
.prow .pbtn{flex:1;letter-spacing:0}
/* Portrait set for phones: same fixed proportions, but the panel runs under the tube so the screen gets the full width. */
@container (max-width: 560px){
  .cabinet{grid-template-columns:1fr;padding:3cqw;gap:2.5cqw;border-radius:5cqw}
  .bezel{padding:2.5cqw;border-radius:3.5cqw}
  .screen{border-radius:7cqw/5.5cqw}
  .face{padding:3.5cqw 4.5cqw;gap:1.2cqw;font-size:clamp(12px,3.6cqw,15px)}
  .osd{font-size:clamp(16px,5cqw,22px)}
  .osd .chn{display:none}
  .panel{display:grid;grid-template-columns:16cqw 1fr 24cqw;grid-template-rows:auto auto;gap:2cqw 3cqw;align-items:center;padding:1cqw 1cqw 0}
  .knobwrap{grid-row:1/3}
  .knob{width:14cqw;height:14cqw}
  .klabel{font-size:clamp(12px,3.2cqw,15px)}
  .dial{grid-template-columns:repeat(2,auto);justify-content:start;gap:.5cqw 4cqw;font-size:clamp(13px,3.6cqw,16px);grid-row:1/3}
  .dial button{white-space:nowrap;overflow:visible;padding:0 1cqw 0 0;letter-spacing:0}
  .osd .rec::before{content:"\25cf "}
  .pbtn{font-size:clamp(14px,3.8cqw,18px);padding:2cqw 1cqw;border-radius:2cqw}
  .prow{gap:1cqw}
  .grille,.brand{display:none}
  .led{width:2.2cqw;height:2.2cqw}
  .feet{padding:0 10cqw}
  .feet i{width:7cqw;height:3.5cqw}
  .antenna{height:8cqw;width:50cqw}
  .antenna i{height:9cqw;width:.8cqw}
}

/* ===== 가로 전제 ===== 가로로 든 폰·태블릿·모니터에서는 세트가 화면 높이에 꼭 맞고, 리모컨(입력)은 오른쪽에 선다.
   세트 높이 ≈ 폭 × 0.605 (4:3 화면 + 베젤 + 캐비닛). 안테나·다리는 접어서 화면에 자리를 준다. */
@media (orientation:landscape){
  body{padding-block:8px}
  .room{max-width:none;flex-direction:row;align-items:center;justify-content:center;gap:14px;min-height:calc(100dvh - 16px)}
  .tv{flex:0 1 auto;width:min(100%,calc((100dvh - 20px) / .605))}
  .antenna,.feet{display:none}
  .kwrap{flex:0 0 clamp(170px,24vw,280px);align-self:center}
  .kwrap .keypad{flex-direction:column}
  .room:has(.kwrap:not([hidden])) .tv{width:min(calc(100% - clamp(170px,24vw,280px) - 14px),calc((100dvh - 20px) / .605))}
}

/* in-screen controls */
.face button{background:rgba(216,240,200,.08);border:1px solid rgba(216,240,200,.35);color:var(--phos);border-radius:6px;padding:7px 10px;font-size:13px;text-shadow:none}
.face button:hover{background:rgba(216,240,200,.16)}

/* 비비기 — 사진을 문지르면 손가락이 지나간 곳 근처의 못 찾은 지점이 잠깐 빛난다. 위치만 알려 준다(여는 건 누르기). 상태·기록은 바꾸지 않는다. */
const RUB_MIN=0.06, RUB_PAD=4, GLOW_MS=1500;
/* 휴대폰은 문지른 직후의 첫 탭에 click 을 안 내 주기도 한다 — 그래서 사진 위의 누르기는 손을 뗄 때(pointerup) 직접 처리하고,
   뒤따라오는 click 은 버린다. 화면이 다시 그려져 사진 요소가 바뀌어도 버리도록 시각은 바깥에 둔다. */
let tapHandledAt=0, rubEndedAt=0;
function bindRub(ph, id){
  let st=null, rubbed=false;
  const layerOf=()=>ph.querySelector(".layer")||ph;
  ph.addEventListener("pointerdown",ev=>{ rubbed=false; st={x:ev.clientX,y:ev.clientY,d:0,big:!!ev.target.closest(".pbig"),cap:!!ev.target.closest(".cap")}; });
  ph.addEventListener("pointermove",ev=>{ if(!st||st.big) return; const L=layerOf(), r=L.getBoundingClientRect(); if(!r.width) return;
    st.d+=Math.hypot(ev.clientX-st.x,ev.clientY-st.y); st.x=ev.clientX; st.y=ev.clientY;
    if(!rubbed&&!st.cap&&st.d>=r.width*RUB_MIN) rubbed=true;
    if(!rubbed) return;
    const c=D.cards[id]; if(!c||!S||!S.opened[me()].includes(id)) return;
    const x=(ev.clientX-r.left)/r.width*100, y=(ev.clientY-r.top)/r.height*100;
    (c.hotspots||[]).forEach((h,i)=>{ if(S.found[me()].includes(id+"#"+i)) return; const hr=h.r||8; if(Math.hypot(x-h.x,y-h.y)>hr+RUB_PAD) return;
      let g=L.querySelector('.glow[data-i="'+i+'"]'); if(g) g.remove();
      g=document.createElement("div"); g.className="glow"; g.dataset.i=i; g.style.left=h.x+"%"; g.style.top=h.y+"%";
      g.style.width=(2*hr)+"%"; g.style.height=(2*hr*r.width/r.height)+"%"; L.appendChild(g);
      setTimeout(()=>{ if(g.isConnected) g.remove(); },GLOW_MS); }); });
  ph.addEventListener("pointerup",ev=>{ const t=st; st=null; if(!t) return;
    if(rubbed){ rubEndedAt=Date.now(); return; }
    const L=layerOf(), r=L.getBoundingClientRect(); if(t.d>=Math.max(12,(r.width||0)*RUB_MIN)) return;
    tapHandledAt=Date.now();
    if(t.big){ const bg=ph.querySelector(".pbig"); bigView(bg&&bg.dataset.big||id); return; }
    clickPhoto({currentTarget:ph,target:ev.target,clientX:ev.clientX,clientY:ev.clientY}, id); });
  const end=()=>{ if(rubbed) rubEndedAt=Date.now(); st=null; };
  ph.addEventListener("pointercancel",end); ph.addEventListener("pointerleave",end);

}
function clickPhoto(ev, id){

  const x=(ev.clientX-r.left)/r.width*100, y=(ev.clientY-r.top)/r.height*100; if(x<0||x>100||y<0||y>100) return;

  if(hit>=0){ const key=id+"#"+hit; lastFound={id,i:hit};
    if(!S.found[who].includes(key)){ capIdx=hit; S.found[who].push(key);
      const sp=specialOf((c.hotspots[hit]||{}).card);
      log("사진 "+id+"의 지점 "+(hit+1)+" — 무언가를 찾았다. 설명이 사진 위에 뜬다."+(sp?" \u25a3 "+sp.kind+" 카드 "+sp.id+eulReul(sp.id)+" 꺼낸다.":""), who, "good");
      ["C","D"].forEach(w=>tryAdvance(w, true)); /* 사진에 머문다 — 방금 연 지점의 설명(▶ 지시)을 가리지 않게 */
      if(c.hotspots[hit].pic) openPicFor(id, hit); /* 이어지는 사진은 처음 찾을 때 저절로 뜬다 */ }
    else { if(capIdx===hit){ capIdx=null; lastFound=null; } else capIdx=hit; render(); } }
  else { S.misses[who].push({id,x:+x.toFixed(1),y:+y.toFixed(1)}); lastFound=null; capIdx=null; log("사진 "+id+"의 한 지점을 눌렀다 — 아무것도 없었다.", who, "bad"); }
}
function askOpen(who,q){ if(!q.need) return true; return q.need.includes("#") ? S.found[who].includes(q.need) : S.opened[who].includes(q.need); }
function partDone(who,m){ if(!S.memPart) S.memPart={C:{},D:{}}; if(!S.memPart[who]) S.memPart[who]={}; return S.memPart[who][m.from]||[]; }
function askHit(q,v){ const n=norm(v); if(!n) return false; if((q.answers||[]).some(a=>norm(a)===n)) return true; return !!(q.keys&&q.keys.length&&q.keys.every(g=>g.some(k=>n.includes(norm(k))))); }
function lateAsks(who){ const out=[]; (D.memory||[]).forEach(m=>{ if(m.role!==who||!S.memDone[who].includes(m.from)||!m.asks) return; const dn=partDone(who,m); m.asks.forEach((q,i)=>{ if(q.optional&&!dn.includes(i)&&askOpen(who,q)) out.push({m,i}); }); }); return out; }
const GATE_LINE="질문은 다 풀렸다. 그런데 아직 이 방에서 열지 않은 곳이 있다 — 사진을 비벼 본다.";
const RUB_LINE="\u25b6 옛 사진이라 잘 안 보이면 비벼서 봐라.";
/* 막 전환 문 — 묶음에 gate(카드#지점)가 있으면 그 지점을 누군가(범인이든 형사든) 열어야 넘어간다 */
function gateOpen(mm){ if(!mm||!mm.gate) return true; return ["C","D"].some(w=>(S.found[w]||[]).includes(mm.gate)); }
function reqLeft(who,mm){ const dn=partDone(who,mm); return mm.asks.map((x,i)=>i).filter(i=>!mm.asks[i].optional&&!dn.includes(i)).length; }
function advanceLine(mm){ return mm.to>=(D.maxAct||4)?"이제 판결이다.":mm.to+"막으로. 그 막의 봉투를 뜯는다. "+RUB_LINE; }
/* 질문은 다 풀렸는데 문이 닫혀 있던 묶음을, 문이 열린 순간 넘긴다 */
function tryAdvance(who, stay){ const m=memFor(who); if(!m||!m.asks||!m.asks.length||reqLeft(who,m)||!gateOpen(m)) return false;
  S.act[who]=m.to; S.memDone[who].push(m.from); if(!stay) ch=4; log("이 방에서 열지 않은 곳을 열었다. "+advanceLine(m), who, "sys"); return true; }
function answerMemory(v){

  if(!m||(m.asks&&m.asks.length)){
    const cands=[]; if(m){ const dn=partDone(who,m); m.asks.forEach((q,i)=>{ if(!dn.includes(i)&&askOpen(who,q)&&!(S.act3Closed&&q.key==="bridge")) cands.push({m,i}); }); }
    late.forEach(x=>cands.push(x));
    if(!cands.length){ toast(m&&m.asks&&!reqLeft(who,m)&&!gateOpen(m)?GATE_LINE:"아직 질문이 나타나지 않았다. 현장을 더 조사한다."); return; }
    const h=cands.find(x=>askHit(x.m.asks[x.i],v));
    if(!h){ log("질문에 답했다 — 아니었다.", who, "bad"); return; }
    const r0=route(); const mm=h.m, q=mm.asks[h.i]; S.memPart[who][mm.from]=partDone(who,mm).concat([h.i]); ch=4;
    if(S.verdict&&VQ.every(x=>S.verdict[x.k]!==undefined)&&route()!==r0) setTimeout(()=>toast("갈래가 바뀌었다 — \"처음부터 다시 적는다\"를 누른다."),0);
    if(mm===m){ const dn=S.memPart[who][mm.from]; const req=mm.asks.map((x,i)=>i).filter(i=>!mm.asks[i].optional); const left=req.filter(i=>!dn.includes(i)).length;
      if(!left&&gateOpen(mm)){ S.act[who]=mm.to; S.memDone[who].push(mm.from); log(q.who+"의 질문 — 맞았다. "+(q.ok||"")+" "+advanceLine(mm), who, "sys"); }

      else log(q.who+"의 질문 — 맞았다. "+(q.ok||"")+" 남은 질문 "+left+"개.", who, "good"); }
    else log(q.who+"의 질문 — 맞았다. "+(q.ok||""), who, "sys");

    return; }
  const ok=(m.answers||[]).some(a=>norm(a)===norm(v));
  if(ok){ S.act[who]=m.to; S.memDone[who].push(m.from); ch=4; log("기억에 답했다 — 맞았다. "+roleName(who)+"은(는) "+m.to+"막으로. 그 막의 카드가 열린다.", who, "sys"); }
  else log("기억에 답했다 — 아니었다.", who, "bad");
}

/* ===================== 판결 — 티비가 열 엔딩 카드를 부른다 ===================== */
/* 취조서·자수서는 같은 한 문장 — 「연쇄 살인범은 ______이다.」 형사가 먼저, 범인이 덮어서 나중에 적는다. */
const VQ=[
 {k:"charge",form:"취조서",who:"형사",q:"「연쇄 살인범은 ______이다.」",opts:[["전부 피의자에게 묶는다","all"],["손을 가른다 — 나머지는 신원 미상","split"],["동생의 이름을 적는다","her"]]},
 {k:"confess",form:"자수서",who:"범인",q:"「연쇄 살인범은 ______이다.」",opts:[["전부 내가 했다 — S1을 뒤집는다","S1"],["나는 하나만 했다 — S2를 뒤집는다","S2"],["자수서를 쓰지 못했다","none"]]}
];
const HER_W=["김서연","서연","그녀","동생","여동생","다리 위","그 애","그애","그 아이"], ME_W=["피의자","범인","이 남자","그 남자","이남자","그남자","나","내가","저","본인"];
const hasW=(t,ws)=>ws.some(w=>norm(t).includes(norm(w)));
function chargeOf(t){ return hasW(t,HER_W)?"her":hasW(t,ME_W)?"all":"split"; }
function confessOf(t){ return hasW(t,HER_W)?"S2":hasW(t,ME_W)?"S1":null; }
function verdictText(k,t){ t=String(t||"").trim(); if(!t) return;
  if(k==="confess"&&!(S.verdict&&S.verdict.charge!==undefined)){ toast("형사가 먼저 취조서를 적는다."); return; }
  const val=k==="charge"?chargeOf(t):confessOf(t);
  if(!val){ toast("「연쇄 살인범은 ___이다」 — 누구인지 적는다. 못 쓰면 「쓰지 못했다」를 누른다."); return; }
  if(!S.verdict) S.verdict={}; S.verdict[k+"Text"]=t; setVerdict(k,val); }
function endingOf(id){ return (D.endings||[]).find(e=>e.id===id)||{id:id,code:id,title:id}; }
const VGRID={"all/S1":"E1","her/S2":"E2","all/none":"E3","split/none":"E4","her/none":"E5",
             "split/S2":"E6","all/S2":"E7","her/S1":"E8","split/S1":"E9"};
function verdictPick(v){ const r=route(); if(r==="none") return ["E4"]; const e=VGRID[v.charge+"/"+v.confess]; if(!e) return []; return r==="both"?[e,"E10"]:[e]; }
/* 자수서(S1·S2)는 3막 범인의 질문 — "그녀는 왜 쿠키를 먹을까" — 을 맞혀야 쓴다. 답은 형사가 쥔 일기장에 있다. */
function askByKey(key){ for(const m of (D.memory||[])){ const i=(m.asks||[]).findIndex(q=>q.key===key); if(i>=0) return {m,i,q:m.asks[i]}; } return null; }
function qDone(key){ const a=askByKey(key); if(!a||!S||!S.memPart||!S.memPart[a.m.role]) return false; return (S.memPart[a.m.role][a.m.from]||[]).includes(a.i); }
/* 갈래 — 3막 두 질문을 누가 맞혔나. both: 히든까지 / culprit: 범인의 자수 / detective: 범인은 연쇄 살인마 / none: 진실 미도달 */
function route(){ const c=qDone("herReason"), d=qDone("bridge"); return c&&d?"both":c?"culprit":d?"detective":"none"; }
function confessOpen(){ const r=route(); return r==="both"||r==="culprit"; }
const ROUTE_LINE={both:"두 사람 다 그녀에게 닿았다 — 엔딩 뒤에 한 장이 더 있다.",culprit:"범인의 자수 — 범인은 자수서를 쓸 수 있다.",detective:"범인은 연쇄 살인마 — 범인은 자수서를 쓸 수 없다.",none:"아무도 그녀에게 닿지 못했다 — 진실 미도달."};
/* 3막: 종이 타이머가 끝났을 때 누르는 문. 두 번 눌러야 넘어가고, 넘어가면 형사의 질문은 닫힌다. */
function endAct3(){ const who=me(); if(!canAct(who)||S.act[who]!==3) return;
  if(!S.endArm){ S.endArm=true; toast("정말 끝났나? 한 번 더 누르면 판결로 간다 — 되돌릴 수 없다."); render(); return; }
  S.endArm=false; S.act3Closed=true; S.act[who]=4; if(!S.memDone[who].includes(3)) S.memDone[who].push(3); ch=4;
  log("시간이 끝났다 — 판결로 간다. 형사의 마지막 질문은 닫혔다.", who, "sys"); }

function newsHtml(){ return ""; }
const GATE={q:"(문제는 제작자 모드 → JSON → gate.q 에 넣는다)", answers:["7920"]};
function renderLobby(scr,body){
  scr.className="screen nosignal"; $("osdL").textContent="CH --"; $("osdR").textContent="";
  if(D.shared){ body.innerHTML=`<div class="start"><div class="brandline">${esc(D.title)}<small>2인 취조 · 티비 한 대</small></div>
      <p class="hint" style="margin:0">테이블 가운데 이 화면 하나를 둘이 같이 본다. 카드의 코드를 넣으면 현장이 뜬다. 화면이 "▶ 범인: 기억 ○를 읽는다"라고 하면 그 사람만 자기 핸드아웃을 펼친다.</p>
      <div class="row"><button class="primary" id="btnShared">켠다</button></div></div>`;
    $("btnShared").onclick=()=>setRoleCode("TV",code||newCode()); return; }
  if(lobbyStep===1||(lobbyStep!==3&&!code)){
    const g=(D.gate&&D.gate.q)?D.gate:GATE;
    body.innerHTML=`${newsHtml()}<div class="start"><div class="brandline">${esc(D.title)}<small>2인 취조</small></div>
      <p class="hint" style="margin:0"><b>먼저 문제.</b> 맞힌 사람이 형사다. 형사 폰에 뜨는 QR을 찍은 사람이 범인이다.</p>
      <p class="gateq">${esc(g.q)}</p>
      <div><label for="gateA">답</label><input id="gateA" autocomplete="off" placeholder="답을 적는다"></div>
      <div class="row"><button class="primary" id="btnGate">답한다</button></div>
      <p class="tiny" id="gateMsg"></p>
      <p class="tiny"><a href="#" id="lnkManual" style="color:var(--phos-dim)">문제 없이 코드로 들어간다 · 한 대 공용</a></p></div>`;
    const go=()=>{ const v=norm($("gateA").value); if(!v){ $("gateA").focus(); return; }
      if((g.answers||[]).some(x=>norm(x)===v)){ code=newCode(); setRoleCode("D",code); setTimeout(qrSheet,80); }
      else { $("gateMsg").textContent="아니다. 다시."; $("gateA").value=""; $("gateA").focus(); } };
    $("btnGate").onclick=go; $("gateA").onkeydown=e=>{ if(e.key==="Enter") go(); };
    $("lnkManual").onclick=e=>{ e.preventDefault(); lobbyStep=3; render(); };
    return;
  }
  if(lobbyStep===3){
    body.innerHTML=`${newsHtml()}<div class="start"><div class="brandline">${esc(D.title)}<small>2인 취조</small></div>
      <p class="hint" style="margin:0">테이블 코드. 두 폰이 같은 코드를 쓰면 같은 게임이다.</p>
      <div><label for="codeLobby">테이블 코드</label><input id="codeLobby" value="${esc(code||newCode())}" maxlength="12" autocapitalize="characters" autocomplete="off" style="font-family:var(--digit);font-size:26px;letter-spacing:.2em;width:12ch"></div>
      <div class="row"><button class="primary" id="btnNext">다음 → 역할</button><button id="btnQuiz">← 문제로</button></div></div>`;
    $("btnNext").onclick=()=>{ const v=norm($("codeLobby").value).replace(/[^A-Z0-9]/g,""); if(v.length<3){ $("codeLobby").focus(); return; } code=v; lobbyStep=2; render(); };
    $("btnQuiz").onclick=()=>{ lobbyStep=1; render(); };
    return;
  }
  body.innerHTML=`${newsHtml()}<div class="start"><div class="brandline">${esc(D.title)}<small>테이블 ${esc(code)}</small></div>
    <p class="hint" style="margin:0">누구의 폰인가. 폰 하나로 하면 "한 대 공용" — ⇄ 로 보는 사람을 바꾼다.</p>
    <div class="grid"><button class="primary" id="rC">범인<small>검붉 — 기억을 되찾는 쪽</small></button><button class="primary" id="rD">형사<small>황토 — 현장을 읽는 쪽</small></button><button id="rTV">한 대 공용<small>⇄ 로 넘긴다</small></button></div>
    <div class="row"><button id="btnBack">← 코드 바꾸기</button></div>
    <p class="tiny">두 폰 연결은 상대도 같은 링크를 열 수 있을 때 된다. ⚙에서 QR.</p></div>`;
  $("rC").onclick=()=>setRoleCode("C",code); $("rD").onclick=()=>setRoleCode("D",code); $("rTV").onclick=()=>setRoleCode("TV",code); $("btnBack").onclick=()=>{ lobbyStep=3; render(); };
}

/* ===================== SHEETS ===================== */
function openSheet(build,{cover=false,title=""}={}){ const sh=$("shutter"), sheet=$("sheet"); sh.hidden=false; const show=()=>{ sheet.innerHTML=""; build(sheet); };
  if(cover&&role==="TV"){ sheet.innerHTML=`<div class="cover"><div class="eye">▮ ▮</div><b>${esc(title)}</b><div class="hint">화면을 가리고 누른다.</div><button class="primary" id="cv">가렸다</button><button id="cx">취소</button></div>`; $("cv").onclick=show; $("cx").onclick=closeSheet; } else show(); }
function closeSheet(){ $("shutter").hidden=true; $("sheet").innerHTML=""; render(); }
function btn(label,sub,fn,cls,dis){ const b=document.createElement("button"); b.innerHTML=esc(label)+(sub?`<small>${esc(sub)}</small>`:""); if(cls) b.className=cls; b.disabled=!!dis; b.onclick=fn; return b; }
function foot(sheet,ok,fn,cancelLabel){ const f=document.createElement("div"); f.className="foot"; f.appendChild(btn(cancelLabel||"닫기","",closeSheet)); if(ok) f.appendChild(btn(ok,"",fn,"primary")); sheet.appendChild(f); }
function textField(s,id,label,ph){ const w=document.createElement("div"); w.innerHTML=`<label for="${id}">${esc(label)}</label>`; const i=document.createElement("input"); i.id=id; i.autocomplete="off"; if(ph) i.placeholder=ph; w.appendChild(i); s.appendChild(w); return i; }
function swapSheet(){ const to=other(me());
  openSheet(s=>{ s.innerHTML=`<div class="cover"><div class="eye">▮ ▮</div><b>${roleName(to)}에게 폰을 넘긴다</b><div class="hint">넘긴 뒤 ${roleName(to)}이(가) 누른다. 사진·문구·기억은 ${roleName(to)}의 것만 보인다.</div></div>`;
    const f=document.createElement("div"); f.className="foot"; f.appendChild(btn("취소","",closeSheet)); f.appendChild(btn("나는 "+roleName(to)+"다","",()=>{ viewer=to; viewCard=null; lastFound=null; closeSheet(); },"primary")); s.appendChild(f); }); }
function settings(){ openSheet(s=>{ s.innerHTML=`<h3>⚙ 설정</h3>`;
  const g=document.createElement("div"); g.className="grid";
  g.appendChild(btn("QR · 테이블 "+code,"상대 폰 연결",()=>{ closeSheet(); qrSheet(); }));
  g.appendChild(btn("제작자 모드","카드·사진·지점·질문",()=>{ closeSheet(); maker(); }));
  g.appendChild(btn("역할 바꾸기","코드·역할 다시 고르기",()=>{ role=null; lobbyStep=2; try{localStorage.removeItem("sbtv2_role");}catch(e){} closeSheet(); }));
  g.appendChild(btn("새 게임","진행 중인 게임 지우기",()=>{ S=freshState(); saveState(); ch=1; closeSheet(); },"danger"));
  s.appendChild(g); foot(s); }); }
function qrSheet(){ openSheet(s=>{ const url=shareUrl();
  s.innerHTML=`<h3>테이블 ${esc(code)}</h3><div class="hint">${role==="C"?"형사":"범인"}이 이 QR을 찍으면 바로 ${role==="C"?"형사":"범인"} 폰이 된다. 안 열리면 같은 링크를 열고 코드 <b style="font-family:var(--digit);font-size:22px">${esc(code)}</b>를 넣는다.</div><div id="qrBox" style="background:#fff;padding:12px;border-radius:8px;width:max-content;max-width:100%;margin:auto"></div><div class="tiny" style="word-break:break-all">${esc(url)}</div>`;
  try{ new QRCode($("qrBox"),{text:url,width:200,height:200,colorDark:"#000",colorLight:"#fff",correctLevel:QRCode.CorrectLevel.M}); }catch(e){ $("qrBox").textContent="QR 생성 실패"; }
  const f=document.createElement("div"); f.className="foot"; f.appendChild(btn("링크 복사","",async()=>{ try{ await navigator.clipboard.writeText(url); }catch(e){} })); f.appendChild(btn("닫기","",closeSheet,"primary")); s.appendChild(f); }); }

/* ===================== MAKER MODE ===================== */
let mkCard=null;
function maker(){ openSheet(s=>{ renderMaker(s); }); }
function renderMaker(s){
  const ids=Object.keys(D.cards); if(!mkCard||!D.cards[mkCard]) mkCard=ids[0]||null;
  s.innerHTML=`<h3>제작자 모드 ⚙</h3><div class="hint">사진 카드를 고르고, 사진을 올리고, 사진 위를 눌러 힌트 지점을 찍는다. 코드·해금 막(act)·문구는 아래 JSON. "적용"하면 이 폰과 같은 테이블의 상대 폰에 저장된다.</div>
    <div class="row"><div><label for="mkSel">카드</label><select id="mkSel">${ids.map(id=>`<option value="${id}" ${id===mkCard?"selected":""}>${id} · ${esc(D.cards[id].title||"")} (${D.cards[id].who} ${D.cards[id].act||1}막 ${D.cards[id].kind})</option>`).join("")}</select></div>
    <div><label for="mkNew">새 카드 번호</label><div class="codein" style="gap:6px"><input id="mkNew" placeholder="K2 (코드는 JSON에서 ㄱ123 꼴로)" style="font-size:16px;letter-spacing:.05em"><button id="mkAdd" type="button">추가</button></div></div></div>
    <div id="mkPhoto"></div>
    <label for="jsonData" style="margin-top:6px">전체 설계 JSON</label><textarea class="json" id="jsonData">${esc(JSON.stringify(D,null,2))}</textarea><div class="hint" id="mkMsg"></div>`;
  const f=document.createElement("div"); f.className="foot";
  f.appendChild(btn("복사","",async()=>{ const t=$("jsonData"); try{ await navigator.clipboard.writeText(t.value); $("mkMsg").textContent="복사했다."; }catch(e){ t.select(); $("mkMsg").textContent="선택했다. 직접 복사한다."; } }));
  f.appendChild(btn("기본값으로","",()=>{ $("jsonData").value=JSON.stringify(DEFAULT_DATA,null,2); }));
  f.appendChild(btn("닫기","",closeSheet));
  f.appendChild(btn("적용","",()=>{ try{ const j=JSON.parse($("jsonData").value); if(!j.cards) throw new Error("cards 없음");
      const locked=JSON.stringify(j.memory)!==JSON.stringify(DEFAULT_DATA.memory)||JSON.stringify(j.endings)!==JSON.stringify(DEFAULT_DATA.endings);
      j.memory=JSON.parse(JSON.stringify(DEFAULT_DATA.memory)); j.endings=JSON.parse(JSON.stringify(DEFAULT_DATA.endings));
      D=j; saveData(true); $("mkMsg").textContent=locked?"적용했다. 막의 질문과 엔딩은 저장소 설계로만 바꾼다 — 그 부분은 무시했다.":"적용했다."; renderMaker(s); }catch(e){ $("mkMsg").textContent="JSON 오류: "+e.message; } },"primary"));
  s.appendChild(f);
  $("mkSel").onchange=e=>{ mkCard=e.target.value; renderMaker(s); };
  $("mkAdd").onclick=()=>{ const id=$("mkNew").value.trim().toUpperCase(); if(!id||D.cards[id]) return; const isC=/^M|^R/.test(id); D.cards[id]={code:String(1+Math.floor(Math.random()*9))+"ㅇ"+String(Math.floor(Math.random()*10))+"ㄱ",who:isC?"C":"D",act:1,kind:isC?"text":"photo",title:"[임시] "+id,img:"",text:"",hotspots:[]}; mkCard=id; renderMaker(s); };
  renderMkPhoto($("mkPhoto"));
}
function renderMkPhoto(w){
  const c=mkCard&&D.cards[mkCard]; if(!c){ w.innerHTML=""; return; }
  if(c.kind!=="photo"){ w.innerHTML=`<div class="hint">${mkCard}은(는) 문구 카드다. 본문은 JSON의 text에 쓴다. 그림을 붙일 수도 있다(지점 없음).</div><div class="photo" style="cursor:default">${c.img?`<img src="${esc(c.img)}" alt="">`:`<div class="ph">${mkCard}<small>그림 없음</small></div>`}</div><div><label for="mkFile">그림 올리기 (jpg/png)</label><input type="file" id="mkFile" accept="image/*"></div>`;
    $("mkFile").onchange=async ev=>{ const f=ev.target.files[0]; if(!f) return; const msg=$("mkMsg"); if(assets){ try{ msg.textContent="올리는 중…"; const a=await assets.upload(f); c.img=a.url; msg.textContent="올렸다. 적용을 눌러 저장한다."; }catch(e){ msg.textContent="업로드 실패: "+(e&&e.code||e); return; } } else { const url=await new Promise(res=>{ const rd=new FileReader(); rd.onload=()=>res(rd.result); rd.readAsDataURL(f); }); c.img=url; } syncJson(); renderMkPhoto(w); }; return; }
  w.innerHTML=`<div class="hint">${esc(c.title||mkCard)} · 코드 <b>${esc(c.code)}</b> · ${c.act||1}막 해금 · 사진 위를 누르면 지점이 추가된다.</div>
    <div class="photo editphoto" id="mkImg">${c.img?`<img src="${esc(c.img)}" alt="">`:`<div class="ph">${mkCard}<small>사진 없음</small></div>`}${(c.hotspots||[]).map((h,i)=>`<div class="spot" style="left:${h.x}%;top:${h.y}%;--d:${(h.r||8)*2}%"><i></i><b>${i+1}</b></div>`).join("")}</div>
    <div class="row"><div><label for="mkFile">사진 올리기 (jpg/png)</label><input type="file" id="mkFile" accept="image/*"></div><div><label for="mkR">새 지점 반지름 %</label><input id="mkR" type="number" min="3" max="25" value="8"></div></div>
    <div class="spotlist" id="mkSpots">${(c.hotspots||[]).map((h,i)=>`<div class="s"><span class="pill">${i+1} · ${h.x},${h.y} r${h.r||8}</span><input data-i="${i}" value="${esc(h.hint)}" placeholder="힌트 문장"><button data-del="${i}" type="button" class="danger">삭제</button></div>`).join("")}</div>`;
  $("mkImg").onclick=ev=>{ const r=ev.currentTarget.getBoundingClientRect(); const x=+((ev.clientX-r.left)/r.width*100).toFixed(1), y=+((ev.clientY-r.top)/r.height*100).toFixed(1); c.hotspots=c.hotspots||[]; c.hotspots.push({x,y,r:+($("mkR").value||8),hint:"[임시] 힌트"}); syncJson(); renderMkPhoto(w); };
  w.querySelectorAll("input[data-i]").forEach(i=>i.oninput=()=>{ c.hotspots[+i.dataset.i].hint=i.value; syncJson(); });
  w.querySelectorAll("button[data-del]").forEach(b=>b.onclick=()=>{ c.hotspots.splice(+b.dataset.del,1); syncJson(); renderMkPhoto(w); });
  $("mkFile").onchange=async ev=>{ const f=ev.target.files[0]; if(!f) return; const msg=$("mkMsg");
    if(assets){ try{ msg.textContent="올리는 중…"; const a=await assets.upload(f); c.img=a.url; msg.textContent="올렸다. 적용을 눌러 저장한다."; }catch(e){ msg.textContent="업로드 실패: "+(e&&e.code||e); return; } }
    else { const url=await new Promise(res=>{ const rd=new FileReader(); rd.onload=()=>res(rd.result); rd.readAsDataURL(f); }); c.img=url; msg.textContent="이 폰에만 저장되는 사진이다 (공유 저장소에는 너무 클 수 있다). 적용을 누른다."; }
    syncJson(); renderMkPhoto(w); };
}
function syncJson(){ const t=$("jsonData"); if(t) t.value=JSON.stringify(D,null,2); }

/* ===================== KNOB ===================== */
$("knobCh").onclick=()=>setChannel(ch%CH.length+1);
window.addEventListener("resize",fitLayer);
$("keypad").onsubmit=ev=>{ ev.preventDefault(); const i=$("keyIn"); const v=i.value.trim(); if(!v){ toast("빈 칸이다. 카드 앞면의 코드 네 글자를 넣고 입력을 누른다."); return; } i.value=""; i.blur(); if(keyMode==="mem"&&!findCard(v)) answerMemory(v); else enterCode(v); };
$("btnSetP").onclick=settings;
$("btnSwapP").onclick=swapSheet;
setInterval(()=>{ const c=$("clock"); if(c&&S&&S.started) c.textContent=stamp(); },1000);

/* ===================== BOOT ===================== */
function boot(data){ S=freshState(); try{ const j=JSON.parse(localStorage.getItem("sbtv2_state")); if(j&&j.started) S=migrateState(j); }catch(e){} if(data&&data.S) S=migrateState(data.S); if(data&&data.ch) ch=data.ch; if(data&&data.viewer) viewer=data.viewer; render();
  window.claude?.hot?.snapshot?.(()=>({S,ch,viewer}));
  if(window.claude&&window.claude.use){ connect().catch(()=>{ dbReady=true; render(); }); } else { dbReady=true; render(); } }
window.claude?.hot?.ready ? window.claude.hot.ready(boot) : boot(window.claude?.hot?.data ?? {});
</script>

</body></html>

}

:root[data-theme="light"]{

body{background:var(--bg);color:var(--fg);font-family:var(--body);

.wrap{max-width:1180px;margin:0 auto;display:grid;gap:18px}
h1{font-family:var(--display);font-size:clamp(22px,3vw,30px);margin:0;text-wrap:balance;font-weight:700}
p.lead{margin:0;color:var(--muted);font-size:14px;max-width:62ch;line-height:1.6}
.board{overflow-x:auto;background:var(--panel);border:1px solid var(--line);border-radius:6px}
svg{display:block;min-width:1100px;width:100%;height:auto;font-family:var(--body)}
.node rect{fill:var(--panel);stroke-width:1.5}

.wit{font-size:11.5px;fill:var(--fg)} .wit.r{fill:var(--muted)}

.vic{font-size:13px;font-weight:700;fill:var(--fg)}

.node .ring{fill:none;stroke-width:1.5}

.edge{fill:none;stroke-width:1.6}
.e-p{stroke:var(--purple)} .e-b{stroke:var(--brown)} .e-s{stroke:var(--steel)} .e-r{stroke:var(--red)}

.legend{display:flex;flex-wrap:wrap;gap:14px 22px;font-size:13px;color:var(--muted)}

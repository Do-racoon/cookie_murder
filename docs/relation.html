<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>쿠키 살인 사건 인물 관계도</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;700&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
/* layout: one full-width board (SVG) with a legend strip under it; purple = 동생/과거 핏줄, brown = 범인 쪽, grey = 형사·수사 */
:root{
  --bg:#1a1620; --panel:#241e2c; --fg:#ebe4f0; --muted:#a79bb3; --line:#4a4058;
  --purple:#9b6dd1; --purple-soft:#3b2b52; --brown:#b8865a; --brown-soft:#45331f;
  --steel:#8aa0b4; --steel-soft:#2a3540; --red:#c94c4c;
  --display:"Noto Serif KR",Georgia,serif; --body:"Noto Sans KR",system-ui,sans-serif;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){ :root:not([data-theme="dark"]){
  --bg:#f3eff6; --panel:#ffffff; --fg:#241e2c; --muted:#6b5f78; --line:#cfc6d8;
  --purple:#6f3fb0; --purple-soft:#e6daf5; --brown:#8a5a2b; --brown-soft:#f0e3d2;
  --steel:#4b6578; --steel-soft:#dfe6ec; --red:#b23a3a; color-scheme:light } }
:root[data-theme="light"]{
  --bg:#f3eff6; --panel:#ffffff; --fg:#241e2c; --muted:#6b5f78; --line:#cfc6d8;
  --purple:#6f3fb0; --purple-soft:#e6daf5; --brown:#8a5a2b; --brown-soft:#f0e3d2;
  --steel:#4b6578; --steel-soft:#dfe6ec; --red:#b23a3a; color-scheme:light }
body{background:var(--bg);color:var(--fg);font-family:var(--body);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:28px}
.wrap{max-width:1180px;margin:0 auto;display:grid;gap:18px}
h1{font-family:var(--display);font-size:clamp(22px,3vw,30px);margin:0;text-wrap:balance;font-weight:700}
p.lead{margin:0;color:var(--muted);font-size:14px;max-width:62ch;line-height:1.6}
.board{overflow-x:auto;background:var(--panel);border:1px solid var(--line);border-radius:6px}
svg{display:block;min-width:1100px;width:100%;height:auto;font-family:var(--body)}
.node rect{fill:var(--panel);stroke-width:1.5}
.node .name{font-family:var(--display);font-weight:700;font-size:15px;fill:var(--fg)}
.main .name{font-size:24px} .main .sub{font-size:12px}
.mid .name{font-size:17px}
.wit{font-size:11.5px;fill:var(--fg)} .wit.r{fill:var(--muted)}
.col{fill:none;stroke:var(--line)} .colh{fill:var(--panel)}
.yr{font-family:var(--display);font-size:13px;font-weight:700;fill:var(--muted)}
.ct{font-family:var(--display);font-size:14px;font-weight:700;fill:var(--fg)}
.hand{font-size:11px;font-weight:700;letter-spacing:.04em}
.h-p{fill:var(--purple)} .h-b{fill:var(--brown)} .h-s{fill:var(--steel)}
.vic{font-size:13px;font-weight:700;fill:var(--fg)}
.axis{stroke:var(--line);stroke-width:2}

.node .ring{fill:none;stroke-width:1.5}
.g-p .ring{stroke:var(--purple)} .g-b .ring{stroke:var(--brown)} .g-s .ring{stroke:var(--steel)}
.node .sub{font-size:11px;fill:var(--muted)}
.g-p rect{stroke:var(--purple)} .g-b rect{stroke:var(--brown)} .g-s rect{stroke:var(--steel)}
.g-p .tag{fill:var(--purple-soft)} .g-b .tag{fill:var(--brown-soft)} .g-s .tag{fill:var(--steel-soft)}
.tagtext{font-size:10px;font-weight:700;letter-spacing:.06em;fill:var(--fg)}
.edge{fill:none;stroke-width:1.6}
.e-p{stroke:var(--purple)} .e-b{stroke:var(--brown)} .e-s{stroke:var(--steel)} .e-r{stroke:var(--red)}
.dash{stroke-dasharray:5 4}
.lbl{font-size:12px;fill:var(--fg)} .lbl.k{font-size:13px;font-weight:700} .lbl.m{fill:var(--muted)}
.lblbg{fill:var(--panel)}
.zone{fill:none;stroke:var(--line);stroke-dasharray:3 5}
.zonet{font-size:11px;fill:var(--muted);letter-spacing:.08em;font-weight:700}
.legend{display:flex;flex-wrap:wrap;gap:14px 22px;font-size:13px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:8px}
.sw{width:26px;height:0;border-top:2px solid}
.sw.d{border-top-style:dashed}
</style>

    <p class="lead">위는 주역 세 사람. 아래는 쿠키 살인과 현행범을 시간순으로 늘어놓고, 사건마다 피해자·손·참고인을 적었다. 1년에 한 번, 10월 — 앞의 세 건은 동생, 맥주집과 현행범은 범인. 형사 부모의 죽음(2015)과 다리 아래의 일(2007)은 목록에 없다.</p>

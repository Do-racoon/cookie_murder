name: check
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.15"
      - run: pip install -r tools/requirements.txt && python -m playwright install --with-deps chromium
      - name: tools/check.py
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            python3 tools/check.py --base HEAD
          else
            python3 tools/check.py --base "$BEFORE"
          fi
